version: '3.8'

services:
  # Core Node.js Express Application Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookmyshow_backend_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      CLIENT_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongodb:27017/bookmyshow_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: docker_development_jwt_access_secret_super_secure_32char_min
      JWT_REFRESH_SECRET: docker_development_jwt_refresh_secret_super_secure_32char_min
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bookmyshow_internal_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/v1/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Primary MongoDB Storage Engine
  mongodb:
    image: mongo:7.0
    container_name: bookmyshow_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - bookmyshow_internal_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # In-Memory Redis Cache & Lock Engine
  redis:
    image: redis:7.2-alpine
    container_name: bookmyshow_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - bookmyshow_internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  bookmyshow_internal_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

