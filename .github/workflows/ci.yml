name: Continuous Integration & Verification

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Test & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Static Code Analysis (ESLint)
        run: npm run lint

      - name: Execute Automated Test Suite (Jest)
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ci_test_db
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_minimum_32_characters_long

      - name: Generate Code Coverage Report
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ci_test_db
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_minimum_32_characters_long

      - name: Archive Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage-report
          path: apps/backend/coverage
          retention-days: 14

